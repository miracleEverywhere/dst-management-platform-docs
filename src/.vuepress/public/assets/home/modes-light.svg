<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title">
  <title id="title">Lite 与完整版</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D3FF2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8C57FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8C57FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2B1450" flood-opacity=".13"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="190%" height="210%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2B1450" flood-opacity=".1"/>
    </filter>
  </defs>

  <ellipse cx="240" cy="180" rx="230" ry="150" fill="url(#glow)"/>

  <!-- Lite card -->
  <g filter="url(#shadow)">
    <rect x="22" y="56" width="190" height="224" rx="22" fill="#FBFAFE" stroke="#E9E3F8" stroke-width="1.5"/>
    <rect x="42" y="78" width="42" height="42" rx="13" fill="url(#brand)"/>
    <path d="M68 87c-6 7-10 14-10 21 6-2 13-6 17-14-2 0-4-1-7-7z" fill="#F8F5FF"/>
    <text x="98" y="98" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="21" font-weight="700" fill="#221A3C">Lite</text>
    <text x="98" y="114" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#8E87A6">轻量 · 单房间</text>
    <rect x="42" y="138" width="150" height="30" rx="9" fill="#FFFFFF" stroke="#EEE7F9"/>
    <circle cx="57" cy="153" r="5" fill="#E8FAF2"/>
    <path d="M54.5 153l1.8 1.8 3-3.2" fill="none" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="157" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#5F5878">约 10MB 内存占用</text>
    <rect x="42" y="176" width="150" height="30" rx="9" fill="#FFFFFF" stroke="#EEE7F9"/>
    <circle cx="57" cy="191" r="5" fill="#E8FAF2"/>
    <path d="M54.5 191l1.8 1.8 3-3.2" fill="none" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="195" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#5F5878">地面 + 洞穴双世界</text>
    <rect x="42" y="214" width="150" height="30" rx="9" fill="#FFFFFF" stroke="#EEE7F9"/>
    <circle cx="57" cy="229" r="5" fill="#E8FAF2"/>
    <path d="M54.5 229l1.8 1.8 3-3.2" fill="none" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="233" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#5F5878">低配服务器友好</text>
  </g>

  <!-- Full card -->
  <g filter="url(#shadow)">
    <rect x="250" y="38" width="208" height="260" rx="22" fill="#FFFFFF" stroke="#E9E3F8" stroke-width="1.5"/>
    <rect x="270" y="58" width="42" height="42" rx="13" fill="#F1ECFF"/>
    <rect x="279" y="67" width="9" height="9" rx="2.5" fill="#7C5CFF"/>
    <rect x="292" y="67" width="9" height="9" rx="2.5" fill="#A78BFA"/>
    <rect x="279" y="80" width="9" height="9" rx="2.5" fill="#A78BFA"/>
    <rect x="292" y="80" width="9" height="9" rx="2.5" fill="#7C5CFF"/>
    <text x="326" y="78" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="19" font-weight="700" fill="#221A3C">完整版</text>
    <text x="326" y="94" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#8E87A6">多房间 · 全功能</text>

    <rect x="270" y="118" width="80" height="62" rx="11" fill="#FBFAFE" stroke="#EEE7F9"/>
    <rect x="358" y="118" width="80" height="62" rx="11" fill="#FBFAFE" stroke="#EEE7F9"/>
    <rect x="270" y="190" width="80" height="62" rx="11" fill="#FBFAFE" stroke="#EEE7F9"/>
    <rect x="358" y="190" width="80" height="62" rx="11" fill="#FBFAFE" stroke="#EEE7F9"/>

    <g>
      <rect x="282" y="130" width="18" height="18" rx="5" fill="#F1ECFF"/>
      <rect x="286" y="134" width="4" height="4" rx="1" fill="#7C5CFF"/>
      <rect x="292" y="134" width="4" height="4" rx="1" fill="#A78BFA"/>
      <rect x="286" y="140" width="4" height="4" rx="1" fill="#A78BFA"/>
      <rect x="292" y="140" width="4" height="4" rx="1" fill="#7C5CFF"/>
      <text x="282" y="167" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="8" fill="#5F5878">多房间</text>
    </g>
    <g>
      <rect x="370" y="130" width="18" height="18" rx="5" fill="#EAF7FF"/>
      <circle cx="379" cy="136" r="3" fill="#38BDF8"/>
      <path d="M373 145c1-5 11-5 12 0" fill="#38BDF8" opacity=".7"/>
      <text x="370" y="167" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="8" fill="#5F5878">用户权限</text>
    </g>
    <g>
      <rect x="282" y="202" width="18" height="18" rx="5" fill="#FFF6E5"/>
      <path d="M291 207v8m-4-4h8" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round"/>
      <text x="282" y="239" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="8" fill="#5F5878">自动备份</text>
    </g>
    <g>
      <rect x="370" y="202" width="18" height="18" rx="5" fill="#FDF2F8"/>
      <path d="M374 212h10m-10-4h7" stroke="#F472B6" stroke-width="1.4" stroke-linecap="round"/>
      <text x="370" y="239" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="8" fill="#5F5878">日志工具</text>
    </g>
  </g>

  <!-- connector -->
  <circle cx="232" cy="168" r="17" fill="#FFFFFF" stroke="#E9E3F8" filter="url(#soft)"/>
  <text x="232" y="173" text-anchor="middle" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="10" font-weight="700" fill="#7C5CFF">或</text>

  <!-- sparkles -->
  <g fill="#C4B5FD">
    <path d="M36 30l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
    <path d="M442 310l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".8"/>
  </g>
  <circle cx="440" cy="24" r="4" fill="#F9A8D4" opacity=".7"/>
</svg>
