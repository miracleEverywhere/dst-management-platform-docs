<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0714"/>
      <stop offset=".55" stop-color="#0E0920"/>
      <stop offset="1" stop-color="#120B27"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6D3FF2" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#4C2BB8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#120B27" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0E6B5C" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0E6B5C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#153A66" stop-opacity=".55"/>
      <stop offset="1" stop-color="#153A66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#C4B5FD" opacity=".16"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".7" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask">
      <rect width="1600" height="1000" fill="url(#fade)"/>
    </mask>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <ellipse cx="1290" cy="100" rx="720" ry="640" fill="url(#violet)"/>
  <ellipse cx="100" cy="920" rx="660" ry="540" fill="url(#mint)"/>
  <ellipse cx="940" cy="600" rx="560" ry="460" fill="url(#blue)"/>
  <rect width="1600" height="1000" fill="url(#dots)" mask="url(#dotMask)"/>
  <g fill="none" stroke="#A78BFA" opacity=".1">
    <circle cx="1310" cy="300" r="250"/>
    <circle cx="1310" cy="300" r="340"/>
    <circle cx="1310" cy="300" r="430"/>
  </g>
</svg>
