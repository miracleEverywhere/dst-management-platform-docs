<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="title">
  <title id="title">云账号同步</title>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8C57FF"/>
    </linearGradient>
    <linearGradient id="cloudFill" gradientUnits="userSpaceOnUse" x1="170" y1="46" x2="312" y2="132">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8C57FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8C57FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8C57FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="190%" height="210%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <marker id="to-cloud" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#8C57FF"/>
    </marker>
    <marker id="to-device" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#8C57FF"/>
    </marker>
    <marker id="sync-head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#F8F5FF"/>
    </marker>
  </defs>

  <ellipse cx="240" cy="150" rx="222" ry="146" fill="url(#glow)"/>

  <!-- Cloud -->
  <g filter="url(#shadow)">
    <g fill="url(#cloudFill)">
      <rect x="170" y="92" width="142" height="40" rx="20"/>
      <circle cx="198" cy="98" r="26"/>
      <circle cx="242" cy="82" r="38"/>
      <circle cx="286" cy="100" r="22"/>
    </g>
    <g fill="none" stroke="#F8F5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M231 107V85m-5 5 5-5 5 5"/>
      <path d="M251 85v22m-5-5 5 5 5-5"/>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M109 182C109 156 138 146 184 134" fill="none" stroke="#6D5AA8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#to-cloud)"/>
  <path d="M296 134C342 146 371 156 371 182" fill="none" stroke="#6D5AA8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 6" marker-end="url(#to-device)"/>

  <!-- Source device -->
  <g filter="url(#soft)">
    <rect x="20" y="190" width="178" height="136" rx="18" fill="#171126" stroke="#322A4E" stroke-width="1.5"/>
  </g>
  <rect x="36" y="206" width="32" height="32" rx="10" fill="#2A2150"/>
  <rect x="44" y="212" width="16" height="5" rx="2.5" fill="#7C5CFF"/>
  <rect x="44" y="220" width="16" height="5" rx="2.5" fill="#A78BFA"/>
  <circle cx="48" cy="231" r="1.8" fill="#A78BFA"/>
  <text x="78" y="223" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" font-weight="700" fill="#EDE9FE">这台 DMP</text>
  <text x="78" y="238" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#9A91B5">先存到云端</text>

  <g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#B8B0D0">
    <rect x="36" y="250" width="146" height="20" rx="10" fill="#171126" stroke="#2C2444"/>
    <circle cx="48" cy="260" r="5" fill="#123B31"/>
    <path d="M45.5 260l1.8 1.8 3-3.2" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="263.5">房间收藏</text>

    <rect x="36" y="273" width="146" height="20" rx="10" fill="#171126" stroke="#2C2444"/>
    <circle cx="48" cy="283" r="5" fill="#123B31"/>
    <path d="M45.5 283l1.8 1.8 3-3.2" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="286.5">游戏令牌</text>

    <rect x="36" y="296" width="146" height="20" rx="10" fill="#171126" stroke="#2C2444"/>
    <circle cx="48" cy="306" r="5" fill="#123B31"/>
    <path d="M45.5 306l1.8 1.8 3-3.2" fill="none" stroke="#34D399" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="59" y="309.5">云存档</text>
  </g>

  <!-- Target device -->
  <g filter="url(#soft)">
    <rect x="282" y="190" width="178" height="136" rx="18" fill="#171126" stroke="#322A4E" stroke-width="1.5"/>
  </g>
  <rect x="298" y="206" width="32" height="32" rx="10" fill="#2A2150"/>
  <path d="M314 212v11m-5-4 5 5 5-5" fill="none" stroke="#7C5CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M307 230h14" fill="none" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round"/>
  <text x="340" y="223" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="13" font-weight="700" fill="#EDE9FE">新的 DMP</text>
  <text x="340" y="238" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9" fill="#9A91B5">登录即恢复</text>

  <g font-family="Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" font-size="9.5" fill="#B8B0D0">
    <rect x="298" y="250" width="146" height="20" rx="10" fill="#171126" stroke="#2C2444"/>
    <circle cx="310" cy="260" r="5" fill="#2A2150"/>
    <path d="M307.5 260l1.8 1.8 3-3.2" fill="none" stroke="#7C5CFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="321" y="263.5">收藏已恢复</text>

    <rect x="298" y="273" width="146" height="20" rx="10" fill="#171126" stroke="#2C2444"/>
    <circle cx="310" cy="283" r="5" fill="#2A2150"/>
    <path d="M307.5 283l1.8 1.8 3-3.2" fill="none" stroke="#7C5CFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="321" y="286.5">令牌已就绪</text>

    <rect x="298" y="296" width="146" height="20" rx="10" fill="#171126" stroke="#2C2444"/>
    <circle cx="310" cy="306" r="5" fill="#2A2150"/>
    <path d="M307.5 306l1.8 1.8 3-3.2" fill="none" stroke="#7C5CFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="321" y="309.5">存档可导入</text>
  </g>

  <!-- sparkles -->
  <g fill="#8C57FF">
    <path d="M52 44l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
    <path d="M240 324l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" opacity=".8"/>
  </g>
  <circle cx="404" cy="58" r="4" fill="#F472B6" opacity=".7"/>
  <circle cx="86" cy="130" r="3" fill="#818CF8" opacity=".8"/>
</svg>
